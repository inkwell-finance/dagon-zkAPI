[package]
name = "dagon-zkapi-vault"
description = "Groth16-first native SOL vault for Dagon zkAPI"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "dagon_zkapi_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=0.32.1"
dagon-zkapi-solana = { path = "../../../crates/dagon-zkapi-solana" }
sha3 = "0.10"
zkapi-core = { path = "../../../protocol/rust/crates/zkapi-core" }
zkapi-types = { path = "../../../protocol/rust/crates/zkapi-types" }

[dev-dependencies]
serde_json = "1"
hex = "0.4"
