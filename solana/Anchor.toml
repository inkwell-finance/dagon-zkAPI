[toolchain]
anchor_version = "0.32.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
dagon_zkapi_vault = "7NdY5ZVP2He8gSiDHZbkfmNfSgKWV2tkZmZgty2C1d8H"

[programs.mainnet]
dagon_zkapi_vault = "7NdY5ZVP2He8gSiDHZbkfmNfSgKWV2tkZmZgty2C1d8H"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[test]
startup_wait = 10000

[scripts]
# Start scripts/localnet/stack.mjs first; Anchor must not launch an unprofiled validator.
test = "cargo test --release --manifest-path ../Cargo.toml -p dagon-zkapi-solana-ledger --test localnet -- --ignored --nocapture"
