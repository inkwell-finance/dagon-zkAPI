openapi: 3.1.0
info:
  title: Dagon zkAPI v2
  version: 2.0.0-testnet
  description: >-
    Solana native-SOL lease, settlement, prepared-operation and withdrawal
    Groth16 protocol API.
    Non-mainnet deployments may require a shared password, advertised by public
    /health testnet_password_required. All service routes then require the
    TestnetPassword header and return 401 testnet_password_required when absent
    or incorrect. mainnet-beta refuses this gate.
security:
  - TestnetPassword: []
  - {}
paths:
  /health:
    get:
      security: []
      summary: Public deployment summary and testnet password requirement
      responses:
        "200":
          description: Public health, including chain_id and testnet_password_required
  /v2/auth:
    get:
      summary: Validate the testnet service password without side effects
      responses:
        "200":
          description: Password accepted, or service access is not password-gated
          content:
            application/json:
              schema:
                type: object
                required: [authenticated]
                properties:
                  authenticated: {const: true}
        "401": {$ref: "#/components/responses/TestnetPasswordRequired"}
  /v2/billing/quote:
    get:
      summary: Read a finalized Pyth SOL/USD billing quote observed by the server
      responses:
        "200":
          description: Native SOL/Pyth quote with exact deployment binding
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SolBillingQuote"}
  /v2/ledger/deposits/prepare:
    post:
      summary: Prepare ordered Solana deposit messages for Wallet Standard signing
      responses:
        "200": {description: Deployment-bound prepared operation and exact legacy messages}
  /v2/ledger/withdrawals/prepare:
    post:
      summary: Prepare an ordered Solana mutual-close operation
      responses:
        "200": {description: Deployment-bound prepared operation and exact legacy messages}
  /v2/ledger/escapes/prepare:
    post:
      summary: Prepare an ordered Solana escape initiation
      responses:
        "200": {description: Deployment-bound prepared operation and exact legacy messages}
  /v2/ledger/escapes/finalize/prepare:
    post:
      summary: Prepare Solana escape finalization
      responses:
        "200": {description: Deployment-bound prepared operation and exact legacy messages}
  /v2/openrouter/leases:
    post:
      summary: Open a prompt-private, spending-limited OpenRouter lease
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApiRequestV2"}
      responses:
        "201":
          description: One-time plaintext runtime key and lease timing
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OpenRouterLease"}
        "400": {description: Invalid request, proof, or disabled lease mode}
        "409": {description: Existing active or settling lease}
        "429":
          description: OA key capacity is temporarily limited; the exact request is safe to retry
          headers:
            Retry-After:
              description: Seconds until the server recommends retrying the same request
              schema: {type: integer, minimum: 0}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
  /v2/openrouter/leases/{client_request_id}:
    get:
      summary: Read non-secret lease state; never returns the runtime key
      parameters:
        - in: path
          name: client_request_id
          required: true
          schema: {type: string}
      responses:
        "200": {description: Lease timing, status, and finalized aggregate usage}
        "404": {description: Unknown lease}
  /v2/withdraw/clearance:
    post:
      summary: Request a mutual-close clearance signature
      responses:
        "200": {description: Schnorr clearance signature}
  /v2/requests/{client_request_id}:
    get:
      summary: Recover a request transcript
      parameters:
        - in: path
          name: client_request_id
          required: true
          schema: {type: string}
      responses:
        "200": {description: Finalized transcript}
        "404": {description: Unknown request}
components:
  securitySchemes:
    TestnetPassword:
      type: apiKey
      in: header
      name: X-ZKAPI-Testnet-Password
      description: Required only when health reports testnet_password_required.
  responses:
    TestnetPasswordRequired:
      description: Missing or invalid shared password; no request processing occurred.
      headers:
        Cache-Control:
          schema: {const: no-store}
      content:
        application/json:
          schema:
            type: object
            required: [error_code, error, retriable]
            properties:
              error_code: {const: testnet_password_required}
              error: {const: "testnet password required or invalid"}
              retriable: {const: false}
  schemas:
    SolBillingQuote:
      type: object
      description: >-
        Accepted in a request authorization only while fresh and only if the
        server itself observed it from the finalized price account.
      additionalProperties: false
      required: [asset, source, credit_unit, base_units_per_asset, chain_id, deployment_binding, backend, network, vault, feed_id, feed_account, receiver_program, price, exponent, confidence, publish_time, expires_at, posted_slot]
      properties:
        asset: {const: native_sol}
        source: {type: string}
        credit_unit: {const: lamports}
        base_units_per_asset: {const: 1000000000}
        chain_id: {type: string, pattern: "^[0-9]+$", description: Exact decimal u64}
        deployment_binding: {type: string}
        backend: {const: dagon.solana.groth16.v1}
        network: {type: string}
        vault: {type: string, description: Base58 vault-state PDA}
        feed_id: {type: string}
        feed_account: {type: string}
        receiver_program: {type: string}
        price: {type: string, pattern: "^[1-9][0-9]*$"}
        exponent: {type: integer}
        confidence: {type: string, pattern: "^[0-9]+$"}
        publish_time: {type: integer}
        expires_at: {type: integer}
        posted_slot: {type: integer}
    Groth16Proof:
      type: object
      required: [backend, proof]
      properties:
        backend: {const: groth16_bn254}
        proof: {type: string, contentEncoding: base64}
    ApiRequestV2:
      type: object
      required: [client_request_id, payload, payload_hash, public_inputs, proof]
      properties:
        client_request_id: {type: string}
        payload: {type: string}
        payload_hash: {type: string, pattern: "^0x[0-9a-f]+$"}
        public_inputs: {type: object, additionalProperties: true}
        proof: {$ref: "#/components/schemas/Groth16Proof"}
    ErrorResponse:
      type: object
      required: [status, client_request_id, error_code, error_message, retriable]
      properties:
        status: {const: error}
        client_request_id: {type: string}
        error_code:
          type: string
          description: Stable machine code; OA limits use oa_minute_request_limit, oa_hourly_issuance_budget, or oa_rate_limited.
        error_message: {type: string}
        retriable: {type: boolean}
        latest_root: {type: string, pattern: "^0x[0-9a-f]+$"}
        server_time_ms: {type: integer}
        retry_after_seconds:
          type: integer
          minimum: 0
          description: Present with OA rate limits and matches the Retry-After header.
    OpenRouterLease:
      type: object
      required: [status, client_request_id, api_key, openrouter_api_base, issued_at, expires_at, valid_for_seconds, settle_after, spending_limit_usd, key_source]
      properties:
        status: {const: active}
        client_request_id: {type: string}
        api_key: {type: string, description: Returned once and never persisted by zkapi-serverd}
        openrouter_api_base: {type: string, format: uri}
        issued_at: {type: integer}
        expires_at: {type: integer}
        valid_for_seconds: {type: integer}
        settle_after: {type: integer}
        spending_limit_usd: {type: number}
        key_source: {type: string, enum: [openrouter, oa_org]}
        verification:
          type: object
          description: Required when key_source is oa_org; submitted to the trusted OA verifier before inference.
          required: [verifier_url, station_id, station_recently_attested, key_valid_till, station_signature, org_signature]
          properties:
            verifier_url: {type: string, format: uri}
            station_id: {type: string}
            station_recently_attested: {type: boolean}
            key_valid_till: {type: integer}
            station_signature: {type: string}
            org_signature: {type: string}
