openapi: 3.1.0
info:
  title: Dagon zkAPI v2
  version: 2.0.0-testnet
  description: >-
    Solana USDC lease, settlement, prepared-operation and withdrawal Groth16
    protocol API. Credits are USDC base units (micro-USDC), billed as
    micro-USD without any price oracle.
    Non-mainnet deployments may require a shared password, advertised by public
    /health testnet_password_required. All service routes then require the
    TestnetPassword header and return 401 testnet_password_required when absent
    or incorrect. mainnet-beta refuses this gate.
security:
  - TestnetPassword: []
  - {}
paths:
  /health:
    get:
      security: []
      summary: Public deployment summary and testnet password requirement
      responses:
        "200":
          description: Public health, including chain_id and testnet_password_required
  /v2/auth:
    get:
      summary: Validate the testnet service password without side effects
      responses:
        "200":
          description: Password accepted, or service access is not password-gated
          content:
            application/json:
              schema:
                type: object
                required: [authenticated]
                properties:
                  authenticated: {const: true}
        "401": {$ref: "#/components/responses/TestnetPasswordRequired"}
  /v2/ledger/deposits/prepare:
    post:
      summary: Prepare ordered Solana USDC deposit messages for Wallet Standard signing
      description: Draws from the payer's canonical USDC token account, which must exist and hold the amount.
      responses:
        "200": {description: Deployment-bound prepared operation and exact legacy messages}
  /v2/ledger/withdrawals/prepare:
    post:
      summary: Prepare an ordered Solana mutual-close operation
      description: destination is the payout USDC token account (any owner); it must be creditable when the final balance is nonzero.
      responses:
        "200": {description: Deployment-bound prepared operation and exact legacy messages}
  /v2/ledger/escapes/prepare:
    post:
      summary: Prepare an ordered Solana escape initiation
      description: destination is the payout USDC token account (any owner) and must be creditable at escape time.
      responses:
        "200": {description: Deployment-bound prepared operation and exact legacy messages}
  /v2/ledger/escapes/finalize/prepare:
    post:
      summary: Prepare Solana escape finalization
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PendingEscapeBody"}
      responses:
        "200": {description: Deployment-bound prepared operation and exact legacy messages}
  /v2/ledger/escapes/release/prepare:
    post:
      summary: Prepare release of a parked escape payout to its bound destination
      description: Permissionless and retryable; pays only the proof-bound destination token account.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PendingEscapeBody"}
      responses:
        "200": {description: Deployment-bound prepared operation and exact legacy messages}
  /v2/ledger/escapes/rent-refund/prepare:
    post:
      summary: Prepare refund of parked pending-escape rent to the escaper
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PendingEscapeBody"}
      responses:
        "200": {description: Deployment-bound prepared operation and exact legacy messages}
  /v2/ledger/usdc-accounts/prepare:
    post:
      summary: Prepare idempotent creation of an owner's canonical USDC token account
      description: Associated Token Account CreateIdempotent; payer pays the rent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [payer, owner]
              properties:
                payer: {type: string, description: Base58 fee and rent payer}
                owner: {type: string, description: Base58 token account owner}
      responses:
        "200": {description: Deployment-bound prepared operation and exact legacy messages}
  /v2/relay:
    get:
      summary: Optional CCTP relay configuration and worst-case fee quotes
      description: >-
        {relayer, fee_account, margin_bps, sol_usd_micros, usdc_mint,
        quotes {deposit, receive, close, escape, burn, sweep}, iris_url,
        burn_minimum}; all amounts are decimal strings of USDC base units
        (burn_minimum is the smallest relayed CCTP burn after the relay fee).
        Every /v2/relay route
        answers 404 relay_disabled when the server has no ZKAPI_RELAYER_KEY.
        Relay errors use {error: {code, message}} with codes relay_disabled,
        insufficient_funds, relay_fee_above_cap, relayer_unavailable,
        cctp_paused, invalid_request and rate_limited.
      responses:
        "200": {description: Relay configuration}
        "404": {description: relay_disabled}
  /v2/relay/deposits/prepare:
    post:
      summary: Prepare an atomic emergency-key-owned deposit with relayer rent funding
      description: >-
        Body {depositor, expected_note_id, commitment, amount, zero_path,
        max_fee, inbound?}. Returns {fee, operation, note, operation_rent,
        note_rent, transaction {format, bytes, last_valid_height,
        lookup_tables}, submit_token}. Rents are decimal lamports. The v0
        transaction advances rent to ek, initializes/writes/executes an
        ek-owned buffer, pays the capped USDC fee and refunds buffer rent
        atomically. It is returned with every signature slot zeroed; the
        emergency key validates the payload, signs and posts it to
        /v2/relay/submit. inbound {source_domain, message, attestation} is the
        attested inbound transfer offered as a sponsorship credential.
      responses:
        "200": {description: Prepared relayed deposit}
  /v2/relay/receives/prepare:
    post:
      summary: Fallback CCTP receive of a zkAPI inbound burn into an existing ATA(ek)
      description: >-
        Body {source_domain, transaction_hash, owner, max_fee}. Returns {fee "0",
        nonce, recipient_token_account, transaction} where transaction is a v0
        transaction (format solana-v0-transaction-v1, lookup_tables;
        [SetComputeUnitLimit(400000), receive_message]) signed
        by the relayer alone for the client to broadcast, or null if the
        nonce is already used. 409 insufficient_funds if ATA(ek) is absent.
        Subsidized receives default to a 1 USDC minimum source burn, a durable
        0.05 SOL UTC-day allowance (including receive-triggered ALT costs),
        and durable 6/day limits per source-chain sender and per emergency key.
        Each attested message reserves allowance once, before any SOL spend or
        signature; repeated preparations of the same message return the same
        transaction while it has at least 30 blocks of validity left and spend
        no further allowance. Restarts and Zoneless top-ups do not reset it.
        Circle forwarding and independently funded receives are unaffected.
      responses:
        "200": {description: Prepared receive or already received}
        "409": {description: insufficient_funds or receive_below_minimum}
        "429": {description: rate_limited, receive_budget_exhausted or receive_address_limited}
  /v2/relay/exits/prepare:
    post:
      summary: Prepare a mutual close or escape with the relayer as vault owner and the ek's fee in the same transaction
      description: >-
        Body {kind, destination_owner, public_inputs, proof, max_fee}. Returns
        {fee, destination (ATA(destination_owner)), transaction, submit_token}
        with an unsigned v0 transaction for the ek to sign and submit. A close
        creates ATA(ek) and pays the fee from the payout; an escape requires
        ATA(ek) to hold the fee. Invalid proofs fail simulation and nothing is
        returned. A valid exit records its note as the ek's sponsorship credential.
      responses:
        "200": {description: Prepared exit}
  /v2/relay/escapes/finalize:
    post:
      summary: Finalize or release a relayed escape
      description: Body {note_id}; returns {signature, action finalize|release}.
      responses:
        "200": {description: Finalized or released}
  /v2/relay/burns/prepare:
    post:
      summary: Prepare an unsigned CCTP burn of ATA(owner); the relay holds the event key
      description: >-
        Body {owner, destination_domain, mint_recipient, destination_caller,
        max_cctp_fee, min_finality_threshold, hook_data, max_fee, inbound?};
        returns {fee, amount, message_sent_event_account, transaction,
        submit_token}. The capped USDC fee covers three burn signatures plus
        one reclaim signature and margin, not MessageSent rent.
        Burn/sweep caps are 50000 base units. The relay floats event rent until
        reclamation after five days, durably capped at 0.5 SOL outstanding and
        reserved only at submit. CCTP exits below 5 USDC net after the relay
        fee are not relayed by default (configurable); Solana exits, sweeps and
        self-funded burns remain available.
      responses:
        "200": {description: Prepared burn}
        "409": {description: burn_below_minimum, insufficient_funds or relay_fee_above_cap}
  /v2/relay/sweeps/prepare:
    post:
      summary: Prepare an unsigned sweep of ATA(owner) to an existing USDC account
      description: Body {owner, destination, max_fee, inbound?}; returns {fee, amount, transaction, submit_token}.
      responses:
        "200": {description: Prepared sweep}
  /v2/relay/submit:
    post:
      summary: Sign, reserve and broadcast an ek-signed prepared relay transaction
      description: >-
        Body {token (the prepare's submit_token), transaction (the prepared
        bytes with the ek's signature)}. The relay checks the token and that
        the message is exactly the prepared one, adds its own (and a burn's
        event-account) signature, simulates with every signature, reserves
        risk and broadcasts; returns {signature, transaction} complete.
        Idempotent. Risk is reserved only here: lost network fees plus
        outstanding reservations against the default 0.02 SOL/day budget
        (0.002 SOL/day for work without a sponsorship credential), the burn
        float, at most one unsettled submission per ek, and an unspent
        sponsorship credential (one attributed failure each: an attested
        minted inbound transfer or a relayed exit's note). Finalized success
        or finalized expired full-history Unknown releases the reservation.
        Only on-chain failures consume losses; only ek-co-signed failures count
        toward the three-per-24h owner/source ban.
        The first three deposit StaleNoteId failures per ek or credential in
        rolling 24 hours are forgiven for credential/ban attribution, not loss
        accounting. Further contention failures consume the credential and
        count toward the ban. The allowance survives restarts.
      responses:
        "200": {description: Complete broadcast transaction}
        "400": {description: invalid_request (token, message, signature or simulation)}
        "409": {description: relay_transaction_expired}
        "429": {description: relay_submission_pending, relay_backing_spent, relay_loss_budget_exhausted, relay_failure_limited or relay_burn_float_exhausted}
  /v2/openrouter/leases:
    post:
      summary: Open a prompt-private, spending-limited OpenRouter lease
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApiRequestV2"}
      responses:
        "201":
          description: One-time plaintext runtime key and lease timing
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OpenRouterLease"}
        "400": {description: Invalid request, proof, or disabled lease mode}
        "409": {description: Existing active or settling lease}
        "429":
          description: OA key capacity is temporarily limited; the exact request is safe to retry
          headers:
            Retry-After:
              description: Seconds until the server recommends retrying the same request
              schema: {type: integer, minimum: 0}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
  /v2/openrouter/leases/{client_request_id}:
    get:
      summary: Read non-secret lease state; never returns the runtime key
      parameters:
        - in: path
          name: client_request_id
          required: true
          schema: {type: string}
      responses:
        "200": {description: Lease timing, status, and finalized aggregate usage}
        "404": {description: Unknown lease}
  /v2/withdraw/clearance:
    post:
      summary: Request a mutual-close clearance signature
      responses:
        "200": {description: Schnorr clearance signature}
  /v2/requests/{client_request_id}:
    get:
      summary: Recover a request transcript
      parameters:
        - in: path
          name: client_request_id
          required: true
          schema: {type: string}
      responses:
        "200": {description: Finalized transcript}
        "404": {description: Unknown request}
components:
  securitySchemes:
    TestnetPassword:
      type: apiKey
      in: header
      name: X-ZKAPI-Testnet-Password
      description: Required only when health reports testnet_password_required.
  responses:
    TestnetPasswordRequired:
      description: Missing or invalid shared password; no request processing occurred.
      headers:
        Cache-Control:
          schema: {const: no-store}
      content:
        application/json:
          schema:
            type: object
            required: [error_code, error, retriable]
            properties:
              error_code: {const: testnet_password_required}
              error: {const: "testnet password required or invalid"}
              retriable: {const: false}
  schemas:
    PendingEscapeBody:
      type: object
      additionalProperties: false
      required: [payer, note_id]
      properties:
        payer: {type: string, description: Base58 fee payer}
        note_id: {type: integer, minimum: 0}
    Groth16Proof:
      type: object
      required: [backend, proof]
      properties:
        backend: {const: groth16_bn254}
        proof: {type: string, contentEncoding: base64}
    ApiRequestV2:
      type: object
      required: [client_request_id, payload, payload_hash, public_inputs, proof]
      properties:
        client_request_id: {type: string}
        payload: {type: string}
        payload_hash: {type: string, pattern: "^0x[0-9a-f]+$"}
        public_inputs: {type: object, additionalProperties: true}
        proof: {$ref: "#/components/schemas/Groth16Proof"}
    ErrorResponse:
      type: object
      required: [status, client_request_id, error_code, error_message, retriable]
      properties:
        status: {const: error}
        client_request_id: {type: string}
        error_code:
          type: string
          description: Stable machine code; OA limits use oa_minute_request_limit, oa_hourly_issuance_budget, or oa_rate_limited.
        error_message: {type: string}
        retriable: {type: boolean}
        latest_root: {type: string, pattern: "^0x[0-9a-f]+$"}
        server_time_ms: {type: integer}
        retry_after_seconds:
          type: integer
          minimum: 0
          description: Present with OA rate limits and matches the Retry-After header.
    OpenRouterLease:
      type: object
      required: [status, client_request_id, api_key, openrouter_api_base, issued_at, expires_at, valid_for_seconds, settle_after, spending_limit_usd, key_source]
      properties:
        status: {const: active}
        client_request_id: {type: string}
        api_key: {type: string, description: Returned once and never persisted by zkapi-serverd}
        openrouter_api_base: {type: string, format: uri}
        issued_at: {type: integer}
        expires_at: {type: integer}
        valid_for_seconds: {type: integer}
        settle_after: {type: integer}
        spending_limit_usd: {type: number}
        key_source: {type: string, enum: [openrouter, oa_org]}
        verification:
          type: object
          description: Required when key_source is oa_org; submitted to the trusted OA verifier before inference.
          required: [verifier_url, station_id, station_recently_attested, key_valid_till, station_signature, org_signature]
          properties:
            verifier_url: {type: string, format: uri}
            station_id: {type: string}
            station_recently_attested: {type: boolean}
            key_valid_till: {type: integer}
            station_signature: {type: string}
            org_signature: {type: string}
