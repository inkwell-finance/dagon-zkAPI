name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  app-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install SDK test dependencies
        run: npm ci

      - name: Test SDK, verify assets and build the fixture bundle
        run: |
          npm test
          npm run verify:assets
          npm run verify:solana-vk
          npm run build:sdk:fixture
          node --test docker/aws/run-daemon.test.mjs
          node --test scripts/check-solana-parity.test.mjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Build app crates
        run: cargo build --release --workspace

      - name: Test app crates
        run: cargo test --release --workspace

      - name: Verify proofs from the shipped browser WASM
        run: cargo run --release --manifest-path protocol/rust/Cargo.toml -p zkapi-proof --example wasm_roundtrip -- "$PWD/scripts/prove-browser-fixture.mjs" "$PWD/sdk"

      - name: Clippy app crates
        run: cargo clippy --workspace -- -D warnings

      - name: Validate operator scripts
        run: bash -n scripts/build-browser-client.sh scripts/build-verifiable-program.sh docker/tee/attestation-hook.sh && sh -n docker/aws/run-daemon.sh

  protocol-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy protocol Rust workspace
        run: cargo clippy --manifest-path protocol/rust/Cargo.toml --workspace -- -D warnings

      - name: Test protocol Rust workspace
        run: cargo test --release --manifest-path protocol/rust/Cargo.toml --workspace -- --test-threads=1

  verifiable-program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verifiable SBF build matches the profile executable hash
        run: bash scripts/build-verifiable-program.sh --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t dagon-zkapi:ci .
