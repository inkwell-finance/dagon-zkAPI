worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    # Avoid recording note IDs, nullifiers, client request IDs or query strings.
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Client address for rate limiting. Only private/loopback peers (the
    # operator's TLS edge or load balancer inside the VPC, or Docker's bridge
    # gateway when the edge runs on the host) may supply it via
    # X-Forwarded-For; the rightmost untrusted hop wins, so client-supplied
    # entries are ignored. Direct public clients are keyed by their own address.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Per-client-IP CCTP relay limits in front of the relay's in-memory
    # per-key/global backstop. CORS preflights are not counted.
    map $request_method $relay_client {
        OPTIONS "";
        default $binary_remote_addr;
    }
    limit_req_zone $relay_client zone=relay_ops:10m rate=30r/m;
    limit_req_zone $relay_client zone=relay_info:10m rate=60r/m;
    limit_req_status 429;
    # Below error_log's level: limited clients' addresses are not recorded.
    limit_req_log_level info;

    server {
        listen 8080;
        # Resolve Docker service addresses again after a service is recreated.
        set $server_upstream http://server:3000;
        set $indexer_upstream http://indexer:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;

        location = /health { proxy_pass $server_upstream; }
        location = /v1/attestation { proxy_pass $server_upstream; }
        location /v2/ { proxy_pass $server_upstream; }
        location = /v2/relay {
            limit_req zone=relay_info burst=20 nodelay;
            error_page 429 = @relay_rate_limited;
            proxy_pass $server_upstream;
        }
        location /v2/relay/ {
            limit_req zone=relay_ops burst=10 nodelay;
            error_page 429 = @relay_rate_limited;
            proxy_pass $server_upstream;
        }
        location @relay_rate_limited {
            default_type application/json;
            add_header Retry-After 60 always;
            add_header Cache-Control "no-store" always;
            add_header Access-Control-Allow-Origin "*" always;
            return 429 '{"error":{"code":"rate_limited","message":"too many relay requests from this address; retry in a minute"}}';
        }
        location /v1/tree/ { proxy_pass $indexer_upstream; }
        location = /config.json {
            root /srv/zkapi;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Access-Control-Allow-Origin "*" always;
        }
        location = /proofs/request.pk {
            root /srv/zkapi;
            default_type application/octet-stream;
            add_header Access-Control-Allow-Origin "*" always;
        }
        location = /proofs/withdrawal.pk {
            root /srv/zkapi;
            default_type application/octet-stream;
            add_header Access-Control-Allow-Origin "*" always;
        }
        location = /proofs/manifest.json {
            root /srv/zkapi;
            default_type application/json;
            add_header Access-Control-Allow-Origin "*" always;
        }
        # Includes the decoded operator dashboard and every unknown route.
        location / { return 404; }
    }
}
