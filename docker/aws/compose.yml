name: dagon-zkapi

x-daemon: &daemon
  image: dagon/zkapi:${ZKAPI_IMAGE_TAG:-concession-v1}
  build:
    context: ../..
    dockerfile: docker/Dockerfile
  entrypoint: ["dagon-zkapi-run"]
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]
  volumes:
    - ${ZKAPI_DATA_DIR:-/var/lib/zkapi}:/data
  networks: [backend]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  indexer:
    <<: *daemon
    command: ["indexer"]
    env_file:
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/deployment.env
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/indexer.env
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 60s

  # Keeps the identity's Pyth SOL/USD push-oracle account fresh at the profile
  # cadence. Untrusted: the server verifies every quote independently.
  pyth-pusher:
    <<: *daemon
    command: ["pyth-pusher"]
    env_file:
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/deployment.env
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/pyth-pusher.env
    volumes:
      - type: bind
        source: ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/pyth-pusher-keypair.json
        target: /run/dagon-zkapi/pyth-pusher-keypair.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://127.0.0.1:3002/health"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60s

  server:
    <<: *daemon
    command: ["server"]
    env_file:
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/deployment.env
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/server.env
    depends_on:
      indexer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 30s

  challenger:
    <<: *daemon
    profiles: ["challenge"]
    command: ["challenger"]
    env_file:
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/deployment.env
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/challenge.env
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ${ZKAPI_DATA_DIR:-/var/lib/zkapi}:/data
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}:/run/dagon-zkapi:ro

  gateway:
    image: dagon/zkapi-gateway:${ZKAPI_IMAGE_TAG:-concession-v1}
    build:
      context: ../..
      dockerfile: docker/aws/Dockerfile.gateway
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]
    volumes:
      - type: bind
        source: ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/config.json
        target: /srv/zkapi/config.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - ${ZKAPI_HTTP_BIND:-127.0.0.1}:${ZKAPI_HTTP_PORT:-8080}:8080
    networks: [backend]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 6s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  # No daemon port is published. Egress is needed for chain/provider RPCs.
  backend:
    driver: bridge
