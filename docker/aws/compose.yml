name: dagon-zkapi

x-daemon: &daemon
  image: dagon/zkapi:${ZKAPI_IMAGE_TAG:-concession-v1}
  build:
    context: ../..
    dockerfile: docker/Dockerfile
  entrypoint: ["dagon-zkapi-run"]
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]
  volumes:
    - ${ZKAPI_DATA_DIR:-/var/lib/zkapi}:/data
  networks: [backend]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  indexer:
    <<: *daemon
    command: ["indexer"]
    env_file:
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/deployment.env
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/indexer.env
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 60s

  server:
    <<: *daemon
    command: ["server"]
    env_file:
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/deployment.env
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/server.env
    depends_on:
      indexer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 30s

  challenger:
    <<: *daemon
    profiles: ["challenge"]
    command: ["challenger"]
    env_file:
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/deployment.env
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/challenge.env
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ${ZKAPI_DATA_DIR:-/var/lib/zkapi}:/data
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}:/run/dagon-zkapi:ro

  signer:
    image: dagon/zkapi-evm-signer:${ZKAPI_IMAGE_TAG:-concession-v1}
    build:
      context: ./signer
    profiles: ["evm-compat"]
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]
    env_file:
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/signer.env
    environment:
      ZKAPI_CHALLENGE_LISTEN_HOST: 0.0.0.0
    networks: [backend]
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r = await fetch('http://127.0.0.1:8547/health', {signal: AbortSignal.timeout(5000)}); if (!r.ok) process.exit(1);"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  gateway:
    image: dagon/zkapi-gateway:${ZKAPI_IMAGE_TAG:-concession-v1}
    build:
      context: ../..
      dockerfile: docker/aws/Dockerfile.gateway
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]
    volumes:
      - type: bind
        source: ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/config.json
        target: /srv/zkapi/config.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - ${ZKAPI_HTTP_BIND:-127.0.0.1}:${ZKAPI_HTTP_PORT:-8080}:8080
    networks: [backend]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 6s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  # No daemon port is published. Egress is needed for chain/provider RPCs.
  backend:
    driver: bridge
