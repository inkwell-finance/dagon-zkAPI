[package]
name = "zkapi-serverd"
description = "Dagon zkAPI server: Groth16 request authorization and CreditLedger settlement"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "dagon-zkapi-challenged"
path = "src/bin/zkapi-challenged.rs"

[features]
# Drill-only misbehaving server modes (`--adversary`); refused at startup in
# builds without debug assertions. Never enabled by release or Docker builds.
adversary = []

[dependencies]
dagon-zkapi-ledger = { path = "../dagon-zkapi-ledger" }
dagon-zkapi-solana-ledger = { path = "../dagon-zkapi-solana-ledger" }
# Official receiver 1.2.0 uses the vault's Anchor 0.32.1; no version alias.
pyth-solana-receiver-sdk = "=1.2.0"
anchor-lang = "=0.32.1"
# Pin the SDK's broad Solana constraint to the tested compatibility generation.
solana-program = "=2.3.0"
bs58 = "=0.5.1"
bincode = "=1.3.3"
solana-keypair = "=2.2.3"
solana-message = { version = "=2.4.0", features = ["bincode"] }
solana-signer = "=2.2.1"
zkapi-types = { path = "../../protocol/rust/crates/zkapi-types" }
zkapi-core = { path = "../../protocol/rust/crates/zkapi-core" }
zkapi-proof = { path = "../../protocol/rust/crates/zkapi-proof" }
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
fs2 = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha3 = { workspace = true }
sha2 = "0.10"
subtle = "2.6"
thiserror = { workspace = true }
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
dagon-zkapi-vault = { path = "../../solana/programs/dagon-zkapi-vault", features = ["no-entrypoint"] }
tower = { version = "0.5", features = ["util"] }
uuid = { workspace = true }
tempfile = { workspace = true }
zkapi-browser = { path = "../../protocol/rust/crates/zkapi-browser" }
