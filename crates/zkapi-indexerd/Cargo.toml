[package]
name = "zkapi-indexerd"
description = "Dagon zkAPI indexer: mirrors the Solana vault into a privacy-safe Merkle snapshot"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "dagon-zkapi-indexerd"
path = "src/main.rs"

[dependencies]
dagon-zkapi-vault = { path = "../../solana/programs/dagon-zkapi-vault", features = ["no-entrypoint"] }
zkapi-types = { path = "../../protocol/rust/crates/zkapi-types" }
zkapi-core = { path = "../../protocol/rust/crates/zkapi-core" }
anchor-lang = "=0.32.1"
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha3 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
