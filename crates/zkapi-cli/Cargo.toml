[package]
name = "zkapi-cli"
description = "Dagon zkAPI Solana operator CLI"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "dagon-zkapi"
path = "src/main.rs"

[features]
# Drill builds only: exposes `serverd --adversary`. Release builds never enable
# it, and the server refuses every mode without debug assertions.
adversary = ["zkapi-serverd/adversary"]

[dependencies]
dagon-zkapi-profile = { path = "../dagon-zkapi-profile" }
zkapi-serverd = { path = "../zkapi-serverd" }
zkapi-indexerd = { path = "../zkapi-indexerd" }
zkapi-types = { path = "../../protocol/rust/crates/zkapi-types" }
zkapi-proof = { path = "../../protocol/rust/crates/zkapi-proof" }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
bs58 = "=0.5.1"
tempfile = { workspace = true }
