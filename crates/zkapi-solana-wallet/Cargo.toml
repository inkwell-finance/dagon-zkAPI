[package]
name = "zkapi-solana-wallet"
description = "Native-SOL wallet helper for zkapi-clientd: proofs, note transitions and Solana vault transactions over stdin/stdout JSON"
edition.workspace = true
version = "0.1.0"
license.workspace = true

[[bin]]
name = "zkapi-solana-wallet"
path = "src/main.rs"

[features]
default = []
# Test-only commands for a disposable local validator (keypair generation, airdrops, vault initialization, a mock Pyth
# account writer). Never part of a release build: clientd refuses a build that reports `dev` outside a localnet profile.
dev = ["dep:pyth-solana-receiver-sdk", "dep:hex"]

[dependencies]
anchor-lang = "=0.32.1"
anyhow = { workspace = true }
base64 = { workspace = true }
bincode = "=1.3.3"
dagon-zkapi-ledger = { path = "../dagon-zkapi-ledger" }
dagon-zkapi-solana-ledger = { path = "../dagon-zkapi-solana-ledger" }
dagon-zkapi-vault = { path = "../../solana/programs/dagon-zkapi-vault", features = ["no-entrypoint"] }
hex = { workspace = true, optional = true }
pyth-solana-receiver-sdk = { version = "=1.2.0", optional = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
solana-keypair = "=2.2.3"
solana-message = { version = "=2.4.0", features = ["bincode"] }
solana-program = "=2.3.0"
solana-signer = "=2.2.1"
tokio = { workspace = true }
zkapi-browser = { path = "../../protocol/rust/crates/zkapi-browser" }
zkapi-proof = { path = "../../protocol/rust/crates/zkapi-proof" }
zkapi-types = { path = "../../protocol/rust/crates/zkapi-types" }
