[package]
name = "dagon-zkapi-solana-ledger"
description = "Solana CreditLedger backend for Dagon zkAPI"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anchor-lang = "=0.32.1"
base64 = { workspace = true }
bincode = "1.3"
dagon-zkapi-ledger = { path = "../dagon-zkapi-ledger" }
dagon-zkapi-vault = { path = "../../solana/programs/dagon-zkapi-vault", features = ["no-entrypoint"] }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha3 = { workspace = true }
solana-hash = "=2.3.0"
solana-compute-budget-interface = "=2.2.2"
solana-instruction = "=2.3.3"
solana-message = { version = "=2.4.0", features = ["bincode"] }
solana-pubkey = "=2.4.0"
tokio = { workspace = true }
zkapi-core = { path = "../../protocol/rust/crates/zkapi-core" }
zkapi-proof = { path = "../../protocol/rust/crates/zkapi-proof" }
zkapi-types = { path = "../../protocol/rust/crates/zkapi-types" }

[dev-dependencies]
solana-keypair = "=2.2.3"
solana-signer = "=2.2.1"
tokio = { workspace = true }
zkapi-indexerd = { path = "../zkapi-indexerd" }
