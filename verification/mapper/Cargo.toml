[package]
name = "picus-mapper"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
zkapi-proof = { path = "../../protocol/rust/crates/zkapi-proof" }
zkapi-core = { path = "../../protocol/rust/crates/zkapi-core" }
ark-ff  = "0.5"
ark-ec  = "0.5"
ark-std = "0.5"
ark-bn254 = "0.5"
ark-crypto-primitives = { version = "0.5", features = ["sponge", "r1cs", "snark"] }
ark-ed-on-bn254 = { version = "0.5", features = ["r1cs", "std"] }
ark-r1cs-std = "0.5"
ark-relations = "0.5"
ark-groth16 = "0.5"
sha2 = "=0.10.9"
hex = "0.4"
serde_json = "1.0"
anyhow = "1.0"
rand = "0.8"

[profile.release]
debug = false
